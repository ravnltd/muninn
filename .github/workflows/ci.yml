name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, node1]
    container:
      image: oven/bun:1.3.6-debian
      options: --memory=3g --memory-swap=3g --cpus=2 --user 1000:1000
      env:
        HOME: /tmp
      volumes:
        - /srv/ci-cache/muninn/bun:/tmp/.bun/install/cache

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
